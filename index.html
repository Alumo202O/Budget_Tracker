```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>

    <!-- Link to CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="main-heading">
        <h1>My Budget Tracker</h1>
        <p>Track your income and expenses in one place.</p>
    </header>

    <main>

        <!-- Add Expense Section -->
        <section class="expense-section">
            <h2>Add Expense</h2>

            <label for="expense-name">Expense Name</label>
            <input type="text" id="expense-name" placeholder="Enter expense name">

            <label for="amount">Amount</label>
            <input type="number" id="amount" placeholder="Enter amount">

            <label for="category">Category</label>
            <input type="text" id="category" placeholder="Enter category">
        </section>

        <!-- Your Expenses Section -->
        <section id="expenses-list">
            <h2>Your Expenses</h2>
            <p>No expenses yet</p>
        </section>

    </main>

</body>
</html>
```
